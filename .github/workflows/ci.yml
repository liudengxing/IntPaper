name: CI

on:
  pull_request:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      release_build:
        description: "Build release artifacts"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UMENG_ANDROID_APPKEY: ${{ secrets.UMENG_ANDROID_APPKEY }}
  UMENG_CHANNEL: ${{ secrets.UMENG_CHANNEL }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  quality:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: dart tool/intpaper.dart store-check
      - run: dart tool/intpaper.dart verify --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan working tree
        run: gitleaks detect --no-git --redact -v --exit-code=2 --config=.gitleaks.toml

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: [quality, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: dart tool/intpaper.dart deps
      - name: Restore Android signing files
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_build }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android release signing secrets are incomplete." >&2
            exit 1
          fi
          mkdir -p android
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/intpaper-new-release.keystore
          {
            echo "storeFile=../intpaper-new-release.keystore"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/intpaper-new-release.keystore android/key.properties
      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.release_build }}
        run: dart tool/intpaper.dart build android-debug
      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_build }}
        run: dart tool/intpaper.dart build android-release
      - name: Build release AAB
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_build }}
        run: dart tool/intpaper.dart build android-aab
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
