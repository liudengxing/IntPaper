# 临时文件放 SSD（F:）。Z: 是机械盘，Gradle 构建是海量小文件随机读写，
# 放在 HDD 上吞吐会低一个数量级。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Djava.io.tmpdir=F:\\gradle-tmp
# 12 逻辑核，默认 2 会严重限制 Kotlin/javac 的并行编译
org.gradle.workers.max=8
# 构建缓存：增量构建可直接复用产物，不必重新执行 task
org.gradle.caching=true
# 配置缓存关闭：AGP 8.11 + Flutter 插件组合下会构建失败，等升级 AGP 后再开
org.gradle.configuration-cache=false
org.gradle.parallel=false
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# Flutter SDK 版本配置（兼容性设置）
flutter.compileSdkVersion=34
flutter.targetSdkVersion=34
flutter.minSdkVersion=23

# 代理配置（仅本地开发使用，CI 环境不需要）
# 如需使用代理，取消下面几行的注释
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7897
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7897
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
